name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PT: Nenhum step aqui toca um SQL Server de verdade — os testes usam SQLite em memória
#     (ver SisHospedar.Tests/CustomWebApplicationFactory.cs) e a checagem de migrations
#     só compara o modelo em código com o snapshot, sem precisar de conexão real. Essa
#     connection string "fake" existe só pra passar o guard clause do Program.cs.
# EN: No step here touches a real SQL Server — tests use in-memory SQLite (see
#     SisHospedar.Tests/CustomWebApplicationFactory.cs) and the migrations check only
#     compares the in-code model against the snapshot, no real connection needed. This
#     "fake" connection string only exists to satisfy Program.cs's guard clause.
env:
  ConnectionStrings__DefaultConnection: "Server=fake;Database=fake;Trusted_Connection=True;"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # PT: Pega exatamente o tipo de bug que passou despercebido antes neste projeto —
      #     um Model alterado sem a migration correspondente, que só quebraria o banco de
      #     quem clonasse o repo do zero.
      # EN: Catches exactly the kind of bug that slipped through unnoticed in this project
      #     before — a changed model with no matching migration, which would only break
      #     the database for someone cloning the repo from scratch.
      - name: Check for pending EF Core model changes without a migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef migrations has-pending-model-changes --project SisHospedar.csproj

  # PT: Só roda em push direto pra main (não em PR) e só depois que build-and-test
  #     passar. Tagueia a imagem com o SHA curto do commit (nunca só ":latest") —
  #     é isso que garante que "az containerapp update --image" sempre detecte uma
  #     imagem diferente e crie uma revisão nova; ver a nota no README sobre a
  #     armadilha de reusar a mesma tag entre deploys.
  #     Migrations não são aplicadas automaticamente aqui — continuam manuais (ver
  #     seção "Redeploy" do README), pra nunca rodar uma migration destrutiva sem
  #     supervisão direta contra o banco de produção.
  # EN: Only runs on a direct push to main (not on a PR) and only after
  #     build-and-test passes. Tags the image with the commit's short SHA (never
  #     just ":latest") — that's what guarantees "az containerapp update --image"
  #     always detects a different image and creates a new revision; see the
  #     README note about the pitfall of reusing the same tag across deploys.
  #     Migrations are not applied automatically here — they stay manual (see the
  #     README's "Redeploy" section), so a destructive migration never runs
  #     unsupervised against the production database.
  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        run: |
          TAG="${{ github.sha }}"
          TAG="${TAG:0:7}"
          docker build -t wesleysales/sishospedar:$TAG -t wesleysales/sishospedar:latest .
          docker push wesleysales/sishospedar:$TAG
          docker push wesleysales/sishospedar:latest

      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Atualiza o Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            TAG="${{ github.sha }}"
            TAG="${TAG:0:7}"
            az containerapp update \
              --name sishospedar \
              --resource-group rg-sishospedar \
              --image wesleysales/sishospedar:$TAG
