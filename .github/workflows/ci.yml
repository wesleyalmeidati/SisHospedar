name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PT: Nenhum step aqui toca um SQL Server de verdade — os testes usam SQLite em memória
#     (ver SisHospedar.Tests/CustomWebApplicationFactory.cs) e a checagem de migrations
#     só compara o modelo em código com o snapshot, sem precisar de conexão real. Essa
#     connection string "fake" existe só pra passar o guard clause do Program.cs.
# EN: No step here touches a real SQL Server — tests use in-memory SQLite (see
#     SisHospedar.Tests/CustomWebApplicationFactory.cs) and the migrations check only
#     compares the in-code model against the snapshot, no real connection needed. This
#     "fake" connection string only exists to satisfy Program.cs's guard clause.
env:
  ConnectionStrings__DefaultConnection: "Server=fake;Database=fake;Trusted_Connection=True;"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # PT: Pega exatamente o tipo de bug que passou despercebido antes neste projeto —
      #     um Model alterado sem a migration correspondente, que só quebraria o banco de
      #     quem clonasse o repo do zero.
      # EN: Catches exactly the kind of bug that slipped through unnoticed in this project
      #     before — a changed model with no matching migration, which would only break
      #     the database for someone cloning the repo from scratch.
      - name: Check for pending EF Core model changes without a migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef migrations has-pending-model-changes --project SisHospedar.csproj

  # PT: O job "deploy" foi removido em 16/09/2026, junto com a desativação da
  #     infraestrutura no Azure (resource group rg-sishospedar). Ele publicava a imagem
  #     no Docker Hub e atualizava o Container App; sem o recurso do outro lado, rodaria
  #     vermelho em todo push. A decisão veio de medição, não de palpite: o Container
  #     Apps concede 180.000 vCPU-s e 360.000 GiB-s por mês, e com minReplicas=1 a
  #     0,5 vCPU a cota se esgotava em ~4,2 dias — o custo diário saltava de R$ 1,01
  #     (só o SQL) para R$ 3,02 a partir daí, ~R$ 90/mês para um site de demonstração
  #     praticamente sem tráfego. Ver a seção "Desativação da infraestrutura" no
  #     CLAUDE.md para os números completos e o caminho de volta.
  #     O CI continua validando o que importa: build, testes e drift de migration.
  # EN: The "deploy" job was removed on 2026-09-16, along with the decommissioning of
  #     the Azure infrastructure (resource group rg-sishospedar). It pushed the image to
  #     Docker Hub and updated the Container App; with the resource gone, it would fail
  #     on every push. The decision came from measurement, not guesswork: Container Apps
  #     grants 180,000 vCPU-s and 360,000 GiB-s per month, and with minReplicas=1 at
  #     0.5 vCPU that grant ran out in ~4.2 days — daily cost jumped from R$ 1.01
  #     (SQL alone) to R$ 3.02 from then on, ~R$ 90/month for a demo site with
  #     essentially no traffic. See "Desativação da infraestrutura" in CLAUDE.md for the
  #     full figures and the path back.
  #     CI still validates what matters: build, tests and migration drift.
